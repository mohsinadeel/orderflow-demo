name: orderflow-demo

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${ORDERFLOW_MYSQL_DATABASE:-orderflow}
      MYSQL_USER: ${ORDERFLOW_MYSQL_USER:-orderflow}
      MYSQL_PASSWORD: ${ORDERFLOW_MYSQL_PASSWORD:-local_orderflow_password}
      MYSQL_ROOT_PASSWORD: ${ORDERFLOW_MYSQL_ROOT_PASSWORD:-local_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./apps/api-express/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - orderflow

  inventory-mysql:
    profiles: ["experiment"]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${ORDERFLOW_INVENTORY_MYSQL_DATABASE:-orderflow_inventory}
      MYSQL_USER: ${ORDERFLOW_INVENTORY_MYSQL_USER:-orderflow_inventory}
      MYSQL_PASSWORD: ${ORDERFLOW_INVENTORY_MYSQL_PASSWORD:-local_inventory_password}
      MYSQL_ROOT_PASSWORD: ${ORDERFLOW_INVENTORY_MYSQL_ROOT_PASSWORD:-local_inventory_root_password}
    volumes:
      - inventory_mysql_data:/var/lib/mysql
      - ./apps/inventory-service/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - orderflow

  inventory-service:
    profiles: ["experiment"]
    build:
      context: ./apps/inventory-service
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DB_HOST: inventory-mysql
      DB_PORT: 3306
      DB_DATABASE: ${ORDERFLOW_INVENTORY_MYSQL_DATABASE:-orderflow_inventory}
      DB_USER: ${ORDERFLOW_INVENTORY_MYSQL_USER:-orderflow_inventory}
      DB_PASSWORD: ${ORDERFLOW_INVENTORY_MYSQL_PASSWORD:-local_inventory_password}
    ports:
      - "${ORDERFLOW_INVENTORY_PORT:-8087}:3000"
    depends_on:
      inventory-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - orderflow

  api-express:
    build:
      context: ./apps/api-express
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${ORDERFLOW_MYSQL_DATABASE:-orderflow}
      DB_USER: ${ORDERFLOW_MYSQL_USER:-orderflow}
      DB_PASSWORD: ${ORDERFLOW_MYSQL_PASSWORD:-local_orderflow_password}
    ports:
      - "${ORDERFLOW_EXPRESS_PORT:-8084}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - orderflow

  api-nest:
    build:
      context: ./apps/api-nest
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${ORDERFLOW_MYSQL_DATABASE:-orderflow}
      DB_USER: ${ORDERFLOW_MYSQL_USER:-orderflow}
      DB_PASSWORD: ${ORDERFLOW_MYSQL_PASSWORD:-local_orderflow_password}
      DB_TABLE_PREFIX: ${ORDERFLOW_DB_TABLE_PREFIX:-}
      ORDERFLOW_BASE_PATH: ${ORDERFLOW_BASE_PATH:-}
      ORDERFLOW_PUBLIC_API_URL: ${ORDERFLOW_PUBLIC_API_URL:-}
      TRUST_PROXY_HOPS: ${ORDERFLOW_TRUST_PROXY_HOPS:-0}
      ORDERFLOW_TEST_FAULT_INJECTION: ${ORDERFLOW_TEST_FAULT_INJECTION:-enabled}
    ports:
      - "${ORDERFLOW_NEST_PORT:-8085}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - orderflow

  web-next:
    build:
      context: ./apps/web-next
      dockerfile: Dockerfile
      args:
        ORDERFLOW_BASE_PATH: ${ORDERFLOW_BASE_PATH:-}
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      ORDERFLOW_API_URL: http://api-nest:3000
      ORDERFLOW_PUBLIC_API_URL: ${ORDERFLOW_PUBLIC_API_URL:-http://localhost:8085}
      ORDERFLOW_BASE_PATH: ${ORDERFLOW_BASE_PATH:-}
    ports:
      - "${ORDERFLOW_WEB_PORT:-8086}:3000"
    depends_on:
      api-nest:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000$${ORDERFLOW_BASE_PATH}').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - orderflow

volumes:
  mysql_data:
  inventory_mysql_data:

networks:
  orderflow:
