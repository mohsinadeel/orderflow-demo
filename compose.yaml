name: orderflow-demo

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${ORDERFLOW_MYSQL_DATABASE:-orderflow}
      MYSQL_USER: ${ORDERFLOW_MYSQL_USER:-orderflow}
      MYSQL_PASSWORD: ${ORDERFLOW_MYSQL_PASSWORD:-local_orderflow_password}
      MYSQL_ROOT_PASSWORD: ${ORDERFLOW_MYSQL_ROOT_PASSWORD:-local_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./apps/api-express/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - orderflow

  api-express:
    build:
      context: ./apps/api-express
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${ORDERFLOW_MYSQL_DATABASE:-orderflow}
      DB_USER: ${ORDERFLOW_MYSQL_USER:-orderflow}
      DB_PASSWORD: ${ORDERFLOW_MYSQL_PASSWORD:-local_orderflow_password}
    ports:
      - "${ORDERFLOW_EXPRESS_PORT:-8084}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - orderflow

  api-nest:
    build:
      context: ./apps/api-nest
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${ORDERFLOW_MYSQL_DATABASE:-orderflow}
      DB_USER: ${ORDERFLOW_MYSQL_USER:-orderflow}
      DB_PASSWORD: ${ORDERFLOW_MYSQL_PASSWORD:-local_orderflow_password}
    ports:
      - "${ORDERFLOW_NEST_PORT:-8085}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - orderflow

  web-next:
    build:
      context: ./apps/web-next
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      ORDERFLOW_API_URL: http://api-nest:3000
    ports:
      - "${ORDERFLOW_WEB_PORT:-8086}:3000"
    depends_on:
      api-nest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - orderflow

volumes:
  mysql_data:

networks:
  orderflow:
